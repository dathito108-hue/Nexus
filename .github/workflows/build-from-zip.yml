name: Build Hyper-Nexus Nit APK
# Trigger rebuild after native runtime brace fix

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP
        shell: python
        run: |
          import zipfile
          from pathlib import Path
          import shutil

          archive = Path("hyper-nexus-nit.zip")
          if not archive.exists():
              raise SystemExit("hyper-nexus-nit.zip not found")

          out = Path("_project")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir()

          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/").lstrip("/")
                  if not name or name.endswith("/"):
                      continue
                  target = out / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst)

          for item in out.iterdir():
              if item.name in {".github", ".git"}:
                  continue
              dest = Path(item.name)
              if dest.exists():
                  if dest.is_dir():
                      shutil.rmtree(dest)
                  else:
                      dest.unlink()
              shutil.move(str(item), str(dest))


      - name: Apply real AI runtime source overlay
        shell: python
        run: |
          from pathlib import Path

          native = Path("app/src/main/cpp/native-lib.cpp")
          current = native.read_text(encoding="utf-8")
          marker = "// =========================================================================\n// 2. REAL MATH: QUANT PRO ALGORITHMS"
          if marker not in current:
              raise SystemExit("native-lib.cpp marker not found")
          head = Path("ai_src/native_head.txt").read_text(encoding="utf-8")
          tail = current[current.index(marker):]
          lora_marker = "// =========================================================================\n// 3. REAL LORA TENSOR WEIGHT MERGER (BINARY MODIFICATION ON DISK)"
          if lora_marker in tail:
              tail = tail[:tail.index(lora_marker)]
          native.write_text(head + tail, encoding="utf-8")

          cmake = Path("ai_src/CMakeLists.txt").read_text(encoding="utf-8")
          Path("app/src/main/cpp/CMakeLists.txt").write_text(cmake, encoding="utf-8")


      - name: Apply P1 memory and agent wiring
        shell: bash
        run: python ai_src/apply_p1.py

      - name: Inspect legacy automation API usage
        shell: bash
        run: |
          set -euo pipefail
          echo "=== GameBotManager source lines 35-60 ==="
          python - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/hypernexus/nit/accessibility/GameBotManager.kt")
          for n, line in enumerate(p.read_text(encoding="utf-8").splitlines(), 1):
              if 35 <= n <= 60:
                  print(f"{n}: {line!r}")
          PY
          echo "=== performClick declarations ==="
          grep -R -n -E "fun performClick" app/src/main/java/com/hypernexus/nit/accessibility/NitAccessibilityService.kt || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android NDK, CMake and SDK platform
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"


      - name: Fetch pinned real llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          LLAMA_CPP_COMMIT="99b95488cac0f00ce3f05af113a8c1e287753f87"
          rm -rf third_party/llama.cpp
          mkdir -p third_party/llama.cpp
          git -C third_party/llama.cpp init
          git -C third_party/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C third_party/llama.cpp fetch --depth 1 origin "$LLAMA_CPP_COMMIT"
          git -C third_party/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMA_CPP_COMMIT"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Repair malformed main layout
        shell: python
        run: |
          from pathlib import Path

          p = Path("app/src/main/res/layout/activity_main.xml")
          s = p.read_text(encoding="utf-8")

          # Close ACTION 4 and its row before ACTION 5.
          marker = (
              'android:text="🌐 INTERNET RAG"\n'
              '                    android:textColor="#FB923C"\n'
              '                    android:textSize="12sp"\n'
              '                    android:textStyle="bold" />\n'
              '\n'
              '        <LinearLayout'
          )
          replacement = (
              'android:text="🌐 INTERNET RAG"\n'
              '                    android:textColor="#FB923C"\n'
              '                    android:textSize="12sp"\n'
              '                    android:textStyle="bold" />\n'
              '\n'
              '                <TextView\n'
              '                    android:layout_width="match_parent"\n'
              '                    android:layout_height="wrap_content"\n'
              '                    android:layout_marginTop="4dp"\n'
              '                    android:text="Tìm kiếm &amp; tổng hợp dữ liệu web thời gian thực"\n'
              '                    android:textColor="#64748B"\n'
              '                    android:textSize="10sp" />\n'
              '            </LinearLayout>\n'
              '        </LinearLayout>\n'
              '\n'
              '        <LinearLayout'
          )
          if marker not in s:
              raise SystemExit("Expected INTERNET RAG nesting marker not found")
          s = s.replace(marker, replacement, 1)

          root = "</androidx.core.widget.NestedScrollView>"
          missing = s.count("<LinearLayout") - s.count("</LinearLayout>")
          if missing > 0:
              s = s.replace(root, ("</LinearLayout>" * missing) + root, 1)

          p.write_text(s, encoding="utf-8")

      - name: Patch Kotlin source compatibility
        shell: python
        run: |
          from pathlib import Path

          def edit(rel, fn):
              p = Path(rel)
              s = p.read_text(encoding="utf-8")
              s2 = fn(s)
              if s2 == s:
                  raise SystemExit(f"No patch applied: {rel}")
              p.write_text(s2, encoding="utf-8")

          edit("app/src/main/java/com/hypernexus/nit/MainActivity.kt",
               lambda s: s.replace("(${mesh.triangleCount} tam giác)", "(${file.length()} bytes)"))

          edit("app/src/main/java/com/hypernexus/nit/accessibility/NitAccessibilityService.kt",
               lambda s: s.replace("package com.hypernexus.nit.accessibility\n",
                                    "package com.hypernexus.nit.accessibility\n\nimport kotlinx.coroutines.launch\n", 1))

          edit("app/src/main/java/com/hypernexus/nit/engine/Procedural3DGenerator.kt",
               lambda s: s.replace("min(i1, i2) to max(i1, i2)", "minOf(i1, i2) to maxOf(i1, i2)")
                           .replace("min(i2, i3) to max(i2, i3)", "minOf(i2, i3) to maxOf(i2, i3)")
                           .replace("min(i3, i1) to max(i3, i1)", "minOf(i3, i1) to maxOf(i3, i1)"))

          edit("app/src/main/java/com/hypernexus/nit/finance/InstitutionalMarketAnalyzer.kt",
               lambda s: s.replace("latestHigh", "lastHigh").replace("latestLow", "lastLow"))

          edit("app/src/main/java/com/hypernexus/nit/finance/SolanaDexDataManager.kt",
               lambda s: s.replace("            if (bestPair == null) {\n                bestPair = pairsArray.getJSONObject(0)\n            }\n\n",
                                   "            if (bestPair == null) {\n                bestPair = pairsArray.getJSONObject(0)\n            }\n            val selectedPair = bestPair!!\n\n")
                           .replace("bestPair.optString", "selectedPair.optString")
                           .replace("bestPair.getJSONObject", "selectedPair.getJSONObject")
                           .replace("bestPair.optDouble", "selectedPair.optDouble")
                           .replace("bestPair.optJSONObject", "selectedPair.optJSONObject"))

          edit("app/src/main/java/com/hypernexus/nit/planner/AutonomousHealer.kt",
               lambda s: s.replace("private fun heal3DAction(", "private suspend fun heal3DAction(")
                           .replace("val storyboard = DynamicCapCutSynthesisEngine.parseDirectorStoryboard(customPrompt)",
                                    "val storyboard = DynamicCapCutSynthesisEngine.parseCapCutSpecFromPrompt(customPrompt)")
                           .replace("${storyboard.themeTitle}", "${storyboard.projectTitle}")
                           .replace("${storyboard.aspectRatio}", "${storyboard.targetAspectRatio}")
                           .replace("${storyboard.cutPacingSeconds}", "${storyboard.cutPacingIntervalSeconds}")
                           .replace("${storyboard.colorGradeLut}", "${storyboard.colorFilterName}")
                           .replace("${storyboard.musicVibe}", "${storyboard.bgmGenre}")
                           .replace("${storyboard.audioDuckingLevelPct}", "${storyboard.bgmVolumePercent}")
                           .replace("${storyboard.visualEffect}", "${storyboard.visualEffectName}"))

          edit("app/src/main/java/com/hypernexus/nit/video/DynamicCapCutSynthesisEngine.kt",
               lambda s: s.replace("MicroRobotOverlayService.RobotState.IDLE", "MicroRobotOverlayService.RobotState.SLEEP")
                           .replace("val clicked = service.clickNodeByText(textOptions)",
                                    "val clicked = textOptions.any { service.clickNodeByText(it) }"))


      - name: Verify real AI runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/cpp/native-lib.cpp
          test -f app/src/main/cpp/CMakeLists.txt
          grep -q '#include "llama.h"' app/src/main/cpp/native-lib.cpp
          grep -q 'add_subdirectory' app/src/main/cpp/CMakeLists.txt
          grep -q 'llama_model_load_from_file' app/src/main/cpp/native-lib.cpp
          grep -q 'llama_decode' app/src/main/cpp/native-lib.cpp
          grep -q 'llama_sampler_sample' app/src/main/cpp/native-lib.cpp
          echo "REAL_AI_RUNTIME_WIRING=OK"


      - name: Verify real AI runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q '#include "llama.h"' app/src/main/cpp/native-lib.cpp
          grep -q 'llama_model_load_from_file' app/src/main/cpp/native-lib.cpp
          grep -q 'llama_decode' app/src/main/cpp/native-lib.cpp
          grep -q 'llama_sampler_sample' app/src/main/cpp/native-lib.cpp
          grep -q 'add_subdirectory' app/src/main/cpp/CMakeLists.txt
          test -f ai_src/native_head.txt
          test -d third_party/llama.cpp
          echo "REAL_AI_RUNTIME_WIRING=OK"

      - name: Enable AndroidX
        run: |
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" >> gradle.properties

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperNexus-Nit-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
