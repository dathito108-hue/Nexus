name: Build Hyper-Nexus Nit APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP
        shell: python
        run: |
          import zipfile
          from pathlib import Path
          import shutil

          archive = Path("hyper-nexus-nit.zip")
          if not archive.exists():
              raise SystemExit("hyper-nexus-nit.zip not found")

          out = Path("_project")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir()

          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/").lstrip("/")
                  if not name or name.endswith("/"):
                      continue
                  target = out / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst)

          for item in out.iterdir():
              if item.name in {".github", ".git"}:
                  continue
              dest = Path(item.name)
              if dest.exists():
                  if dest.is_dir():
                      shutil.rmtree(dest)
                  else:
                      dest.unlink()
              shutil.move(str(item), str(dest))

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android NDK, CMake and SDK platform
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Repair malformed main layout
        shell: python
        run: |
          from pathlib import Path

          p = Path("app/src/main/res/layout/activity_main.xml")
          s = p.read_text(encoding="utf-8")

          # The uploaded layout accidentally nested ACTION 5+ inside the
          # INTERNET RAG card. Close ACTION 4 and its row before ACTION 5.
          marker = '''android:text="🌐 INTERNET RAG"
                    android:textColor="#FB923C"
                    android:textSize="12sp"
                    android:textStyle="bold" />

        <LinearLayout'''
          replacement = '''android:text="🌐 INTERNET RAG"
                    android:textColor="#FB923C"
                    android:textSize="12sp"
                    android:textStyle="bold" />

                <TextView
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:layout_marginTop="4dp"
                    android:text="Tìm kiếm &amp; tổng hợp dữ liệu web thời gian thực"
                    android:textColor="#64748B"
                    android:textSize="10sp" />
            </LinearLayout>
        </LinearLayout>

        <LinearLayout'''
          if marker not in s:
              raise SystemExit("Expected INTERNET RAG nesting marker not found")
          s = s.replace(marker, replacement, 1)

          # Keep the XML balanced as a final guard.
          marker_root = "</androidx.core.widget.NestedScrollView>"
          missing = s.count("<LinearLayout") - s.count("</LinearLayout>")
          if missing > 0:
              s = s.replace(marker_root, ("</LinearLayout>" * missing) + marker_root, 1)

          p.write_text(s, encoding="utf-8")

      - name: Patch Kotlin source compatibility
        shell: python
        run: |
          from pathlib import Path

          def edit(rel, fn):
              p = Path(rel)
              s = p.read_text(encoding="utf-8")
              s2 = fn(s)
              if s2 == s:
                  raise SystemExit(f"No patch applied: {rel}")
              p.write_text(s2, encoding="utf-8")

          edit("app/src/main/java/com/hypernexus/nit/MainActivity.kt",
               lambda s: s.replace("(${mesh.triangleCount} tam giác)", "(${file.length()} bytes)"))

          edit("app/src/main/java/com/hypernexus/nit/accessibility/NitAccessibilityService.kt",
               lambda s: s.replace("package com.hypernexus.nit.accessibility\n",
                                    "package com.hypernexus.nit.accessibility\n\nimport kotlinx.coroutines.launch\n", 1))

          edit("app/src/main/java/com/hypernexus/nit/engine/Procedural3DGenerator.kt",
               lambda s: s.replace("min(i1, i2) to max(i1, i2)", "minOf(i1, i2) to maxOf(i1, i2)")
                           .replace("min(i2, i3) to max(i2, i3)", "minOf(i2, i3) to maxOf(i2, i3)")
                           .replace("min(i3, i1) to max(i3, i1)", "minOf(i3, i1) to maxOf(i3, i1)"))

          edit("app/src/main/java/com/hypernexus/nit/finance/InstitutionalMarketAnalyzer.kt",
               lambda s: s.replace("latestHigh", "lastHigh").replace("latestLow", "lastLow"))

          edit("app/src/main/java/com/hypernexus/nit/finance/SolanaDexDataManager.kt",
               lambda s: s.replace("            if (bestPair == null) {\n                bestPair = pairsArray.getJSONObject(0)\n            }\n\n",
                                   "            if (bestPair == null) {\n                bestPair = pairsArray.getJSONObject(0)\n            }\n            val selectedPair = bestPair!!\n\n")
                           .replace("bestPair.optString", "selectedPair.optString")
                           .replace("bestPair.getJSONObject", "selectedPair.getJSONObject")
                           .replace("bestPair.optDouble", "selectedPair.optDouble")
                           .replace("bestPair.optJSONObject", "selectedPair.optJSONObject"))

          edit("app/src/main/java/com/hypernexus/nit/planner/AutonomousHealer.kt",
               lambda s: s.replace("private fun heal3DAction(", "private suspend fun heal3DAction(")
                           .replace("val storyboard = DynamicCapCutSynthesisEngine.parseDirectorStoryboard(customPrompt)",
                                    "val storyboard = DynamicCapCutSynthesisEngine.parseCapCutSpecFromPrompt(customPrompt)")
                           .replace("${storyboard.themeTitle}", "${storyboard.projectTitle}")
                           .replace("${storyboard.aspectRatio}", "${storyboard.targetAspectRatio}")
                           .replace("${storyboard.cutPacingSeconds}", "${storyboard.cutPacingIntervalSeconds}")
                           .replace("${storyboard.colorGradeLut}", "${storyboard.colorFilterName}")
                           .replace("${storyboard.musicVibe}", "${storyboard.bgmGenre}")
                           .replace("${storyboard.audioDuckingLevelPct}", "${storyboard.bgmVolumePercent}")
                           .replace("${storyboard.visualEffect}", "${storyboard.visualEffectName}"))

          edit("app/src/main/java/com/hypernexus/nit/video/DynamicCapCutSynthesisEngine.kt",
               lambda s: s.replace("MicroRobotOverlayService.RobotState.IDLE", "MicroRobotOverlayService.RobotState.SLEEP")
                           .replace("val clicked = service.clickNodeByText(textOptions)",
                                    "val clicked = textOptions.any { service.clickNodeByText(it) }"))

      - name: Enable AndroidX
        run: |
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" >> gradle.properties

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperNexus-Nit-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
